[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "kafka-dae-diagnostics"  # REQUIRED, is the only field that cannot be marked as dynamic.
dynamic = ["version"]
description = "ISIS Kafka DAE Diagnostics"
readme = "README.md"

# PyO3 rust/Cargo.toml "abi3" tag should also be set to *lowest* supported python version
requires-python = ">=3.12"
license-files = ["LICENSE"]

authors = [
  {name = "ISIS Experiment Controls", email = "ISISExperimentControls@stfc.ac.uk" }
]
maintainers = [
  {name = "ISIS Experiment Controls", email = "ISISExperimentControls@stfc.ac.uk" }
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "confluent-kafka",
  "ess-streaming-data-types",
  "numpy>=2",
  "p4p",
]

[project.optional-dependencies]
doc = [
  "sphinx", 
  "sphinx_rtd_theme", 
  "myst_parser",
  "sphinx-autobuild",
  "sphinx-codeautolink",
  "sphinxcontrib-mermaid",
  "sphinxcontrib-spelling",
]
lint = [
  "pyright",
  "ruff",
]
test = [
  "pytest",
  "pytest-cov",
]
dev = [
  "kafka-dae-diagnostics[doc,lint,test]",
]

[project.urls]
"Homepage" = "https://github.com/isiscomputinggroup/kafka_dae_diagnostics"
"Bug Reports" = "https://github.com/isiscomputinggroup/kafka_dae_diagnostics/issues"
"Source" = "https://github.com/isiscomputinggroup/kafka_dae_diagnostics"

[tool.pytest.ini_options]
testpaths = "tests"
asyncio_mode = "auto"
addopts = "--cov --cov-report=html -vv"

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
  "version.py",  # Autogenerated
]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "@abstractmethod",
]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.pyright]
include = ["src", "tests"]
reportConstantRedefinition = true
reportDeprecated = true
reportInconsistentConstructor = true
reportMissingParameterType = true
reportMissingTypeArgument = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true
reportUnnecessaryIsInstance = true
reportUntypedBaseClass = true
reportUntypedClassDecorator = true
reportUntypedFunctionDecorator = true

[tool.build_sphinx]

[project.scripts]
kdaediag = "kafka_dae_diagnostics._cli:main"

[tool.maturin]
module-name = "kafka_dae_diagnostics._kdaediag_rs"
